services:
  - type: web
    name: farmhub-api
    runtime: docker
    plan: starter
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings.prod
      - key: DEBUG
        value: "False"
      - key: ENV
        value: production
      - key: LOG_FORMAT
        value: json
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: farmhub-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: farmhub-redis
          property: connectionString
      - key: AUTH_COOKIE_SECURE
        value: "True"
      - key: AUTH_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: CSRF_COOKIE_SAMESITE
        value: Lax
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: keyvalue
    name: farmhub-redis
    plan: starter
    ipAllowList: []

databases:
  - name: farmhub-postgres
    plan: starter
